# fallout_postgres_data: /var/lib/pgsql/data
# fallout_postgres_init: /usr/bin/postgresql-setup
# fallout_redis_port: 6380
# fallout_gunicorn_port: 8000
# fallout_web_workers: 3
# fallout_celery_concurrency: 2
# fallout_gunicorn_version: '26.2.0'
