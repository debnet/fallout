[build-system]
requires = ["hatchling>=1.27,<2", "Babel>=2.17,<3"]
build-backend = "hatchling.build"

[project]
name = "fallout-rpg"
dynamic = ["version"]
description = "Django tools for a homebrew Fallout tabletop role-playing game"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Marc Debureaux", email = "marc@debureaux.fr" }]
keywords = ["django", "fallout", "rpg", "tabletop", "gamemaster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "celery>=5.6.2,<6",
    "common-framework[excel,markdown]==2026.10.27",
    "coreapi>=2.3.3,<3",
    "django>=6.0,<7",
    "django-compressor>=4.6,<5",
    "django-configurations[database]>=2.5.1,<3",
    "django-cors-headers>=4.9,<5",
    "django-debug-toolbar>=6.1,<9",
    "django-modeltranslation>=0.19.19,<1",
    "django-multiselectfield>=1.0.1,<2",
    "django-redis>=6,<8",
    "djangorestframework>=3.18.3,<4",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "djangorestframework-xml>=2,<3",
    "markdown2>=2.5.4,<3",
    "pillow>=12.1,<14",
    "python-dateutil>=2.8.2,<2.9",
    "pytz>=2025.2",
    "redis>=7.1,<9",
    "requests>=2.32.5,<3",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.3.2,<4"]
dev = [
    "black>=26.5,<27",
    "build>=1.2,<2",
    "coverage>=7.17,<8",
    "flake8>=7.3,<8",
    "isort>=9,<10",
    "model-bakery>=1.20.5,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.11,<5",
    "pytest-env>=1.2,<2",
    "twine>=6,<8",
]

[project.scripts]
fallout-rpg = "fallout_cli:main"

[tool.hatch.version]
path = "rpg/__init__.py"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.mo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["fallout", "rpg"]
exclude = ["/fallout/tests/**"]

[tool.hatch.build.targets.wheel.force-include]
"fallout_cli.py" = "fallout_cli.py"
"statics" = "rpg/statics"
"templates" = "rpg/templates"

[tool.hatch.build.targets.sdist]
include = [
    "/fallout",
    "/rpg",
    "/statics",
    "/templates",
    "/locale",
    "/fallout_cli.py",
    "/hatch_build.py",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/PACKAGING.md",
    "/DOCKER.md",
    "/.dockerignore",
    "/.env.example",
    "/docker",
    "/ansible/deploy.yml",
    "/ansible/tls.yml",
    "/ansible/redis-selinux.yml",
    "/ansible/requirements.yml",
    "/ansible/inventory.example.ini",
    "/ansible/vars.example.yml",
    "/ansible/README.md",
    "/ansible/templates",
    "/ansible/tests",
    "/manage.py",
    "/requirements.txt",
    "/pytest.ini",
    "/mypy.ini",
    "/Dockerfile",
    "/docker-compose.yml",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
