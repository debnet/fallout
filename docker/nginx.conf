server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;

    location /static/ {
        alias /var/lib/fallout/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded media may be private. Never expose the entire directory here.
    location /medias/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        # This listener is loopback-only, behind a trusted HTTPS terminator.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
